const dimensions = [
  { id:'expression', code:'E', title:'情感表达', en:'Emotional expression', left:'含蓄', right:'外显', summary:'表达关心和情绪时，你倾向于多直接地让对方知道。' },
  { id:'assurance', code:'S', title:'确认需求', en:'Need for reassurance', left:'安于未知', right:'期待确认', summary:'当关系暂时不确定时，你有多希望获得明确回应。' },

  {id:'q01',dimension:'expression',text:'当我很在乎一个人时，我会让对方明确地感受到。',reverse:false},
  {id:'q02',dimension:'assurance',text:'重要的人突然变得冷淡时，我会希望知道原因。',reverse:false},
  {id:'q03',dimension:'autonomy',text:'即使和一个人关系很好，我也需要一些完全属于自己的时间。',reverse:false},

  {id:'q05',dimension:'disclosure',text:'面对信任的人，我能说出那些令我感到脆弱的想法。',reverse:false},

// scoring.js

const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
const normalizeAnswer = (answer,reverse=false) => {
  if (!Number.isInteger(answer) || answer < 1 || answer > 5) throw new Error('Likert answer must be an integer from 1 to 5');
  return reverse ? 6-answer : answer;
};
function isComplete(answers={}) {
  return questions.every(q => Number.isInteger(answers[q.id]) && answers[q.id]>=1 && answers[q.id]<=5) && scenarios.every(q => q.options.some(o => o.id === answers[q.id]));
}
function scoreDimensions(answers={}) {
  return dimensions.map(d => {
    const items = questions.filter(q=>q.dimension===d.id);
    const available = items.filter(q=>Number.isInteger(answers[q.id]) && answers[q.id]>=1 && answers[q.id]<=5);
    const mean = available.length ? available.reduce((acc,q)=>acc+normalizeAnswer(answers[q.id],q.reverse),0)/available.length : null;
    // 1 -> 0, 3 -> 50, 5 -> 100. Missing items excluded, never implicitly neutral.
    return {...d, score:mean===null ? null : Math.round((mean-1)/4*100),answered:available.length,total:items.length};
  });
}
function profileFromAnswers(answers={}) {
  const scores=scoreDimensions(answers);
  const values=Object.fromEntries(scores.map(d=>[d.id,d.score]));
  const philosophy=scenarios.map(s=>({id:s.id,chapter:s.chapter,text:s.text,choice:s.options.find(o=>o.id===answers[s.id])||null}));
  return {complete:isComplete(answers),scores,values,philosophy};
}

const FIELDS=['expression','assurance','autonomy','repair','disclosure'];
const WEIGHTS=[1,1,1,1,1];
function rankDogs(profile){
  if(!profile?.complete) throw new Error('A completed assessment is required');
  const vector=FIELDS.map(f=>profile.values[f]);
  if(vector.some(x=>!Number.isFinite(x))) throw new Error('Missing dimension');
  const ranks=DOGS.map(d=>({dog:d,distance:Math.sqrt(d.prototype.reduce((s,p,i)=>s+WEIGHTS[i]*(p-vector[i])**2,0))}));
  ranks.sort((a,b)=>a.distance-b.distance || DOGS.indexOf(a.dog)-DOGS.indexOf(b.dog));
  return ranks;
}
function selectDog(profile){return rankDogs(profile)[0].dog;}

function shell(content,page){
 document.title=({home:'Between Us · 你是哪一种小狗？',intro:'写给你的第一页 · Between Us',test:'24 页小小的提问 · Between Us',result:'你的犬系人格 · Between Us',about:'关于这本小狗手记 · Between Us'})[page]||'Between Us';
 return `<div class="site ${page==='test'?'site-test':''}"><header class="site-header"><div class="header-inner"><a href="#home" class="wordmark" aria-label="回到首页"><span class="wordmark-mark">b<span class="wordmark-dot">.</span>u</span><span class="wordmark-rule"></span><span class="wordmark-chinese">我们之间</span></a><nav class="top-nav" aria-label="主导航"><a href="#about">关于测试</a>${session?`<button class="nav-resume" type="button" data-action="resume">${session.stage==='done'?'我的小狗':'继续作答'} <span aria-hidden="true">↗</span></button>`:''}</nav></div></header><main id="main" tabindex="-1">${content}</main><footer class="site-footer"><div class="footer-inner"><span>BETWEEN US <span class="foot-divider">/</span> DOG NOTES VOL. 01</span><span class="footer-middle">关于被爱，也关于如何去爱。</span><a href="#about">说明与隐私 ↗</a></div></footer></div>`;
}
function heroPortraits(){return `<div class="dog-sheet" aria-label="原创绘制的三只小狗肖像"><div class="dog-sheet-caption"><span>FIELD NOTES ON AFFECTION</span><span>PLATE 01 / 12</span></div><div class="dog-sheet-main">${dogPortrait('shiba',{size:163})}${dogPortrait('golden',{size:188})}${dogPortrait('border',{size:164})}</div><div class="dog-sheet-footer"><span>每一只小狗，<br/>都有自己的靠近方式。</span><span class="hand-sign">hello, little soul. ↗</span></div></div>`;}
function home(){return shell(`<section class="hero dog-hero"><div class="hero-copy"><div class="micro-kicker"><span class="ink-dot"></span>A FIELD GUIDE TO OUR HEARTS <span class="kicker-index">VOL. 001</span></div><div class="tiny-chapter">A LITTLE BOOK ABOUT YOU <span>✳</span></div><h1 class="hero-title dog-title">你是哪一种<br/><em>小狗？</em></h1><p class="hero-cn">Between Us <span class="cn-tiny-line"></span> 犬系人格手记</p><div class="hero-quote"><span class="hand-quotes">“</span><p>有人热烈地奔向你，有人安静地等你。<br/>我们爱人与被爱的方式，或许各不相同。</p></div><div class="hero-actions"><button class="button button-primary" data-action="start">翻开我的小狗手记 ${icons.arrow}</button>${session?`<button class="text-button resume-button" data-action="resume">${session.stage==='done'?'查看上次结果':'继续上次的测试'} ↗</button>`:''}</div><div class="hero-fineprint"><span><i class="fine-sun"></i>24 个问题</span><span>约 6–8 分钟</span><span>12 种小狗人格</span></div></div><div class="hero-art dog-hero-art">${heroPortraits()}</div></section>
 <section class="manifesto dog-manifesto">${eyebrow('01','WHAT WE MAY DISCOVER')}<h2>每一种靠近，<br/>都有自己的形状。</h2><div class="manifesto-grid"><div><span class="manifesto-no">I.</span><h3>你的关系习惯</h3><p>在乎、需要回应、保留空间、面对误会，以及打开内心。</p></div><div><span class="manifesto-no">II.</span><h3>你的犬系人格</h3><p>12 种有趣的小狗原型，用一张肖像写下你与重要的人相处的样子。</p></div><div><span class="manifesto-no">III.</span><h3>你的内心选择</h3><p>爱情与知己不必分成两张问卷。我们只问：你如何珍惜一个人？</p></div></div></section>
 <section class="bottom-quote"><span>AN UNFINISHED LITTLE LETTER</span><p>to love, and to be understood.</p><button class="button button-secondary" data-action="start">开始这段相遇 ${icons.arrow}</button></section>`, 'home');}
function intro(){return shell(`<section class="intro-page narrow-page page-enter">${eyebrow('01','BEFORE WE BEGIN')}<div class="intro-paper dog-intro"><span class="stamp-round">DOG<br/>NOTES<br/>✳</span><p class="script-overline">Dear little soul,</p><h1>想更了解你，<br/>从一封小小的提问开始。</h1><div class="intro-paragraphs"><p>接下来有 24 个问题。请按照你平时真实的想法作答，而不是最希望自己成为的样子。</p><p>这里的「重要的人」，可以是喜欢的人、伴侣、最好的朋友，或那个能够懂你的人。</p><p>结果会是一种小狗品种，它并不定义你，只是为你与人的相处方式取一个好玩的名字。</p></div><div class="intro-handnote">take your time. <span>↘</span></div></div><div class="intro-footer"><span>20 道关系题 · 4 道哲学题</span><button class="button button-primary" data-action="begin">开始测试 ${icons.arrow}</button></div><p class="soft-warning">原创趣味问卷，尚未经过科学信效度验证；人格与犬种的联系仅为创意隐喻。</p></section>`, 'intro');}
function questionOpts(q,selected){return `<div class="question-option-list ${q.kind==='scenario'?'scenario-options':''}" role="radiogroup" aria-label="请选择最接近自己的一项">${q.kind==='likert'?`<div class="likert-ends"><span>不像我</span><span>很像我</span></div>${likertOptions.map((o,i)=>`<label class="answer-option"><input type="radio" name="answer" value="${o.value}" ${o.value===selected?'checked':''}/><span class="answer-letter">${String(i+1).padStart(2,'0')}</span><span class="answer-name">${o.label}</span><span class="answer-indicator" aria-hidden="true">${icons.check}</span></label>`).join('')}`:q.options.map((o,i)=>`<label class="answer-option"><input type="radio" name="answer" value="${o.id}" ${o.id===selected?'checked':''}/><span class="answer-letter">${String.fromCharCode(i+65)}</span><span class="answer-name">${o.label}</span><span class="answer-indicator" aria-hidden="true">${icons.check}</span></label>`).join('')}</div>`;}
function test(){const q=allQuestions[currentIndex];const v=session.answers[q.id],done=v!==undefined;const chapter=currentIndex<5?'关于靠近':currentIndex<10?'关于沉默':currentIndex<15?'关于信任':currentIndex<20?'关于那些说不出口的话':'关于选择';return shell(`<section class="test-page page-enter"><div class="test-upper"><div class="test-meta"><span><span class="person-dot"></span>一人一页 · 真实的你</span><span class="test-page-index">PAGE ${String(currentIndex+1).padStart(2,'0')} <span class="slash">/</span> ${total}</span></div><div class="progress-track" role="progressbar" aria-label="作答进度" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered()}"><div class="progress-filled" style="width:${answered()/total*100}%"></div></div></div><div class="question-content"><div class="question-chapter"><span>CHAPTER ${String(Math.floor(currentIndex/5)+1).padStart(2,'0')}</span><span class="chapter-symbol">✳</span><span>${chapter}</span></div><div class="question-hairline"></div><h1 class="question-heading">${escapeHtml(q.text)}</h1><p class="question-note">${escapeHtml(q.kind==='scenario'?q.note:'这一页没有标准答案，只要选最接近你平常状态的那一项。')}</p>${questionOpts(q,v)}</div><div class="test-bottom"><button class="nav-prev" data-action="prev" ${currentIndex===0?'disabled':''}>${icons.back} 上一页</button><span class="test-progress-text"><span id="answered-count">${answered()}</span> / ${total} noted</span><button class="button button-primary button-next" data-action="next" ${done?'':'disabled'}>${currentIndex===total-1?'看看我的小狗':'下一页'} ${icons.arrow}</button></div><div class="test-doodle"><span>${icons.paw}</span><span>every answer leaves a little paw print.</span></div></section>`,'test');}
function scoreRow(d){return `<div class="score-row"><div class="score-head"><div><span class="score-cn">${d.title}</span><span class="score-en">${d.en}</span></div><strong>${d.score}<small> / 100</small></strong></div><div class="score-line"><div class="score-line-fill" style="width:${d.score}%"></div></div><div class="score-anchors"><span>${d.left}</span><span>${d.right}</span></div></div>`;}
function result(){const p=profileFromAnswers(session.answers);if(!p.complete)return home();const r=reportFor(p),dog=r.dog;return shell(`<div class="report-page dog-report page-enter"><section class="report-cover dog-report-cover">${eyebrow('RESULT','YOUR LITTLE DOG PERSONA')}<div class="dog-cover-grid"><div class="dog-cover-copy"><p class="report-to">YOUR LITTLE SOUL LOOKS LIKE...</p><p class="dog-result-pre">你的犬系人格是</p><h1 class="dog-breed">${dog.name}</h1><h2 class="dog-nickname">「${dog.nickname}」</h2><p class="report-lead">${dog.subtitle}</p><p class="dog-note">${dog.note}</p><div class="dog-cover-tags"><span>24 / 24 PAGES</span><span>NO. ${String(DOGS.indexOf(dog)+1).padStart(2,'0')} OF 12</span></div></div><div class="dog-result-visual"><div class="dog-art-paper">${dogPortrait(dog.id,{size:300})}<span class="dog-hand-tag">${dog.en}</span></div></div></div><p class="report-disclaimer">这是依据本次回答匹配的趣味原型，并非科学人格分类。你也带着一点「${r.runnerUp.nickname}」的影子。</p></section>
<section class="report-section report-section-cream dog-story">${eyebrow('I','HOW YOU CARE')}<div class="report-two-col"><div><h2>在重要的人面前，<br/>你是这样的。</h2><p class="section-description">不论是爱情，还是一段珍贵的知己关系，你都有自己靠近与陪伴的方式。</p></div><div><p class="story-paragraph">${escapeHtml(dog.bond)}</p><div class="story-pullquote">${escapeHtml(dog.note)}</div></div></div></section>
<section class="report-section">${eyebrow('II','YOUR INNER LANDSCAPE')}<div class="report-two-col"><div><h2>五条细线，<br/>画出你的相处习惯。</h2><p class="section-description">这只是当前 20 题的描述性分数。高低没有优劣意义，也不代表关系的好坏。</p></div><div class="score-list">${r.details.map(scoreRow).join('')}</div></div></section>
<section class="report-section report-section-cream">${eyebrow('III','THE UNSPOKEN PART')}<div class="report-two-col"><div><h2>即使是小狗，<br/>心里也会有小小的结。</h2></div><div class="dog-shadow"><p>${escapeHtml(dog.shadow)}</p>${r.tensions.map(t=>`<p>${escapeHtml(t)}</p>`).join('')}<div class="dog-letter">给理解你的人：<br/><span>${escapeHtml(dog.message)}</span></div></div></div></section>
<section class="report-section">${eyebrow('IV','NOTES FROM YOUR ANSWERS')}<div class="report-two-col"><div><h2>具体一点，<br/>再认识自己。</h2></div><div class="narrative-list">${r.details.map((d,i)=>`<div class="narrative-item"><span class="narrative-no">0${i+1} / ${d.title}</span><p>${escapeHtml(d.description)}</p></div>`).join('')}</div></div></section>
<section class="report-section report-section-cream">${eyebrow('V','FOUR PHILOSOPHICAL NOTES')}<h2>那些没有标准答案的选择。</h2><div class="philo-list">${p.philosophy.map((item,i)=>`<div class="philo-item"><span class="philo-no">0${i+1}</span><div><h3>${escapeHtml(item.chapter)}</h3><p>${escapeHtml(item.choice.value)}</p><span>${escapeHtml(item.choice.detail)}</span></div></div>`).join('')}</div></section>
<section class="reflection-section">${eyebrow('VI','A LETTER TO KEEP')}<h2>还有三个问题，<br/><em>想悄悄留给你。</em></h2><ol>${r.questions.map(q=>`<li>${escapeHtml(q)}</li>`).join('')}</ol><div class="result-actions"><button class="button button-primary" data-action="share">分享我的小狗 ${icons.arrow}</button><button class="button button-secondary" data-action="print">${icons.print} 打印 / 保存 PDF</button><button class="button button-tertiary" data-action="reset">重新测试</button></div><p class="soft-warning">犬种是人物性格的文学隐喻，并非由真实犬种预测人的心理。这份问卷未进行信效度验证，不适合用于诊断或择友决策。</p><div id="toast" role="status" aria-live="polite" class="toast"></div></section></div>`,'result');}
function about(){return shell(`<section class="about-page narrow-page page-enter">${eyebrow('ABOUT','WHAT THIS IS AND IS NOT')}<h1 class="page-title">关于这本<br/><em>小狗人格手记。</em></h1><p class="page-lead">Between Us 只提供一套测试：由一个人完成，结果同时描述他在爱情与深厚友情中的关系倾向。没有情侣模式、知己模式或双人比较。</p><div class="about-block"><h2>为什么是 24 题？</h2><p>前 20 题分别关注情感表达、确认需求、个人空间、冲突修复、内在分享五个关系维度，每维四题（含反向计分项）；后 4 题探索自由、真诚、改变与失去，没有对错，也不会影响犬种结果。</p></div><div class="about-block"><h2>小狗人格怎么来的？</h2><p>我们为 12 种犬系角色设计了五维原型。答完后，系统将你的五维得分与原型比较，选出距离最近的一种。这是透明、可复现的创意映射，不是随机抽签，也不是从科学研究中发现的 12 种人格类别。</p><p>这些形象只是文学性的隐喻，并不说明真实狗狗的品种就有固定个性。每只狗和每个人都不该被简单贴标签。</p></div><div class="about-block"><h2>心理学与隐私</h2><p>问卷部分借鉴关系心理学中的一些概念，但原创题目和人格原型尚未经过信度、效度或跨群体公平性验证，不构成诊断、匹配度预测，也不用于判断谁更值得被爱。</p><p>回答仅保存在当前浏览器的 localStorage，不上传服务器；使用同一设备的他人可能读取本地数据。你可以随时清除记录。</p></div><div class="about-actions"><button class="button button-primary" data-action="start">翻开第一页 ${icons.arrow}</button>${session?'<button class="button button-tertiary" data-action="reset">删除本地答案</button>':''}</div><div class="about-epilogue"><p>「不同的小狗，有不同的尾巴语言。<br/>不同的人，也有各自表达爱的方式。」</p><span>— BETWEEN US / A LITTLE DOG NOTE</span></div></section>`,'about');}
function resume(){if(!session){navigate('intro');return;}if(session.stage==='done'&&isComplete(session.answers)){navigate('result');return;}currentIndex=findNext();navigate('test');}
function reset(){const d=document.createElement('dialog');d.className='confirm-dialog';d.innerHTML='<div class="dialog-deco">✳</div><h2>重新写一本小狗手记？</h2><p>原来的答案和结果将从当前浏览器中清除，无法撤回。</p><div class="dialog-actions"><button class="button button-tertiary" data-cancel>先保留</button><button class="button button-primary" data-confirm>清除并重新开始</button></div>';document.body.append(d);d.querySelector('[data-cancel]').addEventListener('click',()=>d.close());d.querySelector('[data-confirm]').addEventListener('click',()=>{clearSession();session=null;d.close();navigate('intro');});d.addEventListener('close',()=>d.remove());d.showModal();}
function render(){let route=(location.hash||'#home').slice(1);if(!['home','intro','test','result','about'].includes(route))route='home';if(route==='test'&&!session)route='intro';if(route==='result'&&(!session||!isComplete(session.answers)))route='home';if(route==='test'&&session?.stage==='done'&&isComplete(session.answers))route='result';const page={home,intro,test,result,about}[route];app.innerHTML=page();window.scrollTo({top:0,behavior:'instant'});}
app.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button)return;switch(button.dataset.action){
 case 'start':navigate('intro');break;
 case 'begin':session=makeSession();saveSession(session);currentIndex=0;navigate('test');break;
 case 'resume':resume();break;
 case 'prev':currentIndex=Math.max(0,currentIndex-1);render();break;
 case 'next':{const q=allQuestions[currentIndex];if(session?.answers[q.id]===undefined)return;if(currentIndex<total-1){currentIndex++;render();break;}if(!isComplete(session.answers)){currentIndex=findNext();render();break;}session.stage='done';saveSession(session);navigate('result');break;}
 case 'reset':reset();break;
 case 'print':window.print();break;
 case 'share':{const dog=reportFor(profileFromAnswers(session.answers)).dog;const message=`我做了「Between Us · 犬系人格手记」测试，结果是 ${dog.name}——${dog.nickname}。${dog.note}`;let ok=false;try{if(navigator.share){await navigator.share({title:'我的犬系人格',text:message});ok=true;}else if(navigator.clipboard){await navigator.clipboard.writeText(message);ok=true;}}catch(err){if(err.name==='AbortError')return;}const toast=app.querySelector('#toast');if(toast)toast.textContent=ok?'已分享或复制结果文字。':'可截图或打印保存你的结果。';break;}
 }});
app.addEventListener('change',e=>{const input=e.target;if(input?.name!=='answer'||!session||!location.hash.startsWith('#test'))return;const q=allQuestions[currentIndex];const value=q.kind==='likert'?Number(input.value):input.value;if(q.kind==='likert'&&(!Number.isInteger(value)||value<1||value>5))return;if(q.kind==='scenario'&&!q.options.some(o=>o.id===value))return;session.answers[q.id]=value;saveSession(session);const next=app.querySelector('[data-action="next"]');if(next)next.disabled=false;const count=app.querySelector('#answered-count');if(count)count.textContent=String(answered());const filled=app.querySelector('.progress-filled');if(filled)filled.style.width=`${answered()/total*100}%`;const bar=app.querySelector('[role="progressbar"]');if(bar)bar.setAttribute('aria-valuenow',String(answered()));});
window.addEventListener('hashchange',render);
if(location.hash==='#test'&&session)currentIndex=findNext();
render();

</script>
</body>
</html>
